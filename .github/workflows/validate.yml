name: Validazione PR
on:
  pull_request:
    branches: [ main ] # Scatta quando apri una PR verso il main

jobs:
  validate-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 'Install Salesforce CLI'
        run: npm install @salesforce/cli --global

      - name: 'Authenticate'
        run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" > auth_url.txt
          sf org login sfdx-url --sfdx-url-file auth_url.txt --set-default

      - name: 'Validazione (Check-only)'
        run: sf project deploy validate --source-dir force-app --test-level RunLocalTests